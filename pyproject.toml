[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resnet-theory"
version = "1.0.0"
description = "Depth sweeps of penalised two-layer ResNets and diagnostics of open-weight transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
open-weights = ["transformers>=4.56", "datasets>=2.19"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["resnet_theory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
