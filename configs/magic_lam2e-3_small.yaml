# MAGIC depth sweep, lambda_res = 0.002, initialisation "small":
#   U, V ~ N(0, 0.3^2 / fan_in), independent of depth. Biases start at zero.
name: magic_lam2e-3_small
output_dir: outputs
data:
  path: data/magic04.data   # downloaded from UCI on first use
  val_fraction: 0.2         # random split; the seed sets the split
model:
  width: 6
  init:
    block_scale: 0.3
    head_scale: 0.3
    depth_scaling: false
objective:
  lambda_res: 2.0e-3
  lambda_out: 1.0e-6
sweep:
  depths: [4, 8, 16, 32, 64]
  seeds: [0, 1, 2]           # each seed sets the data split and the initialisation
optimizer:
  adam_steps: 3000
  adam_lr: 1.0e-3
  warmup_steps: 100
  min_lr_ratio: 0.05         # cosine decay to 5e-5
  lbfgs_steps: 2000
  lbfgs_history: 100
  lbfgs_tolerance_grad: 1.0e-7
  lbfgs_tolerance_change: 1.0e-9
